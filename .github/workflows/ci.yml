name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Integration tests run against a real PostgreSQL: the exclusion constraint
    # that prevents double booking cannot be exercised against a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zynetna
          POSTGRES_PASSWORD: zynetna_ci
          POSTGRES_DB: zynetna_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zynetna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zynetna:zynetna_ci@localhost:5432/zynetna_test?schema=public
      TEST_DATABASE_URL: postgresql://zynetna:zynetna_ci@localhost:5432/zynetna_test?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      JOB_TOKEN: ci-job-token-value
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage-ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx next build

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zynetna:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
