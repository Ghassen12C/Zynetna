name: Deploy

# Deployment is manual or on a tag: a green CI run proves the code is sound,
# but choosing when production changes stays a decision, not a side effect.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Federated credentials — no long-lived secret in the repository.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        run: az acr login --name ${{ secrets.AZURE_REGISTRY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY }}.azurecr.io/zynetna:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY }}.azurecr.io/zynetna:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migrations run before the new revision takes traffic, so the schema is
      # never behind the code that expects it.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci --omit=dev --ignore-scripts
          npx prisma migrate deploy

      - name: Release new revision
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY }}.azurecr.io/zynetna:${{ github.sha }}

      - name: Verify health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ secrets.APP_URL }}/api/health" | grep -q '"status":"ok"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done
          echo "Health check never passed; investigate before sending traffic."
          exit 1
